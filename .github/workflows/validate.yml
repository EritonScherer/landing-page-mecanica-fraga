name: Validate Astro site

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - production
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ vars.SITE_URL || 'https://eritonscherer.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/landing-page-mecanica-fraga/' }}
