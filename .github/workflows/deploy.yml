name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          SITE_URL: ${{ vars.SITE_URL || 'https://eritonscherer.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/landing-page-mecanica-fraga/' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contato@mecanicafraga.com.br' }}
          CONTACT_INSTAGRAM_URL: ${{ vars.CONTACT_INSTAGRAM_URL || 'https://instagram.com/' }}
          CONTACT_WHATSAPP_NUMBER: ${{ vars.CONTACT_WHATSAPP_NUMBER || '5547999999999' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
